# Template only — DO NOT commit a real copy of this file with filled-in keys.
#
# litellm's own proxy API (the one opencode/port-forward talks to) is
# protected by LITELLM_MASTER_KEY, separate from the KSERVE_TOKEN the
# Deployment mints for itself to call the InferenceServices.
#
# POSTGRES_PASSWORD / DATABASE_URL back litellm's Admin UI (see
# k8s/deployment-postgres.yaml) — /ui/login fails with "Not connected to
# DB!" without these, even though the plain API works with just the master
# key. DATABASE_URL must embed the same password as POSTGRES_PASSWORD.
# ./01-deploy.sh generates both for you; only fill these in by hand if
# you're not using that script.
#
# OPENROUTER_API_KEY is what authenticates the nemotron-3.5-lightning model
# entry (see k8s/configmap-litellm-config.yaml and README "Real
# tool-calling: the OpenRouter model"). Get a free key at
# https://openrouter.ai/keys and set it with
# scripts/add-openrouter-key.sh — don't paste it into this file or any
# command line (shell history), and don't hand it to anything other than
# your own oc/kubectl session.
#
# Generate the base secret with:
#   oc create secret generic litellm-secrets \
#     --from-literal=LITELLM_MASTER_KEY="sk-$(openssl rand -hex 24)" \
#     -n "$NAMESPACE"
#
# ...or fill in the values below and `oc apply -f` it (then keep the filled
# file out of version control).
apiVersion: v1
kind: Secret
metadata:
  name: litellm-secrets
  namespace: ${NAMESPACE}
type: Opaque
stringData:
  LITELLM_MASTER_KEY: "sk-REPLACE-ME"
  POSTGRES_PASSWORD: "REPLACE-ME"
  DATABASE_URL: "postgresql://litellm:REPLACE-ME@postgres-service:5432/litellm"
  OPENROUTER_API_KEY: "sk-or-v1-REPLACE-ME"  # optional — omit if you're not using scripts/add-openrouter-key.sh
