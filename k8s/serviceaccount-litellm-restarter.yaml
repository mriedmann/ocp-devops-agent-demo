# ServiceAccount whose auto-mounted token both litellm (to call the
# InferenceServices) and the token-refresh CronJob (to restart the
# Deployment) rely on. No other permissions are attached directly to it;
# the CronJob's ability to restart the Deployment comes from the
# RoleBinding in rolebinding-litellm-restarter.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: litellm-restarter
  namespace: ${NAMESPACE}
