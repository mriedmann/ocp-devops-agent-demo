apiVersion: v1
kind: Pod
metadata:
  name: demo-slow
  labels: {app: demo-slow, ocp-agent-demo: 10-liveness}
spec:
  containers:
    - name: slow
      image: registry.access.redhat.com/ubi9/ubi-minimal:latest
      # Takes ~40s to warm up before it is healthy.
      command: ["sh", "-c", "echo warming up; sleep 40; touch /tmp/healthy; echo ready; sleep 3600"]
      livenessProbe:
        exec: {command: ["cat", "/tmp/healthy"]}
        initialDelaySeconds: 5
        periodSeconds: 5
        failureThreshold: 2
      resources:
        requests: {cpu: 5m, memory: 8Mi}
        limits: {cpu: 50m, memory: 32Mi}
