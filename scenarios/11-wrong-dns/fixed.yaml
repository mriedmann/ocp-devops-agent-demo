apiVersion: v1
kind: Pod
metadata:
  name: demo-backend
  labels: {app: demo-backend, ocp-agent-demo: 11-wrong-dns}
spec:
  containers:
    - name: httpd
      image: registry.access.redhat.com/ubi9/httpd-24:latest
      ports: [{containerPort: 8080}]
      resources:
        requests: {cpu: 5m, memory: 32Mi}
        limits: {cpu: 100m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: demo-backend
  labels: {ocp-agent-demo: 11-wrong-dns}
spec:
  selector: {app: demo-backend}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: v1
kind: Pod
metadata:
  name: demo-frontend
  labels: {app: demo-frontend, ocp-agent-demo: 11-wrong-dns}
spec:
  containers:
    - name: client
      image: registry.access.redhat.com/ubi9/ubi-minimal:latest
      env:
        - {name: BACKEND_URL, value: "http://demo-backend:8080/"}
      command:
        - sh
        - -c
        - |
          while true; do
            if curl -sS -o /dev/null --max-time 3 "$BACKEND_URL"; then echo "backend OK"; else echo "backend call failed: $BACKEND_URL"; fi
            sleep 10
          done
      resources:
        requests: {cpu: 5m, memory: 8Mi}
        limits: {cpu: 50m, memory: 32Mi}
